<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi al Registro Elettronico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./login.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./librerie/axios@1.1.2.min.js"></script>
    <script src="./libreria.js"></script>
    <script src="./login.js"></script>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center">Registro Elettronico</h2>
        <h5 class="text-center text-muted mb-4">Accedi con le tue credenziali</h5>

        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"  placeholder="Inserisci il tuo username">
            </div>
            <label for="password" id="lblPsw" class="form-label ">Password</label>
            <div class="mb-4 input-group">
                <input type="password" class="form-control" id="password" name="password" placeholder="Inserisci la tua password">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye"></i></button>
            </div>
            <div id="loginError" class="alert alert-danger d-none" role="alert">
            Username o password errati.
            </div>
            <button type="button" class="btn btn-primary w-100" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-2"></i> Accedi
            </button>
            <div class="text-center mt-3">
                <a href="#" class="text-decoration-none" style="color: #6a11cb;">Hai dimenticato la password?</a>
            </div>
        </form>
    </div>
</body>
</html>
