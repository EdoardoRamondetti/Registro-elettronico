<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nuova password - Registro Elettronico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./login.css" />
  <script src="./librerie/axios@1.1.2.min.js"></script>
    <script src="./libreria.js"></script>
  <script src="./nuovaPassword.js"></script>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center">Devi cambiare la password per continuare</h2>
    <form>

    <div class="mb-3">
       <label for="psw" class="form-label">password attuale</label>
       <div class="d-flex">
          <input type="password" class="form-control" id="pswAttuale" placeholder="Inserisci la password ricevuta su email" style="border-top-right-radius: 0; border-bottom-right-radius: 0;"/>
          <button class="btn btn-outline-secondary" type="button" name="togglePassword" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            <i class="bi bi-eye"></i></button>
       </div>
      </div>
      <div class="mb-3">
        <label for="psw" class="form-label">Nuova password</label>
        <div class="d-flex">
          <input type="password" class="form-control" id="psw" placeholder="Inserisci la nuova password" style="border-top-right-radius: 0; border-bottom-right-radius: 0;"/>
          <button class="btn btn-outline-secondary" type="button" name="togglePassword" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            <i class="bi bi-eye"></i></button>
        </div>
      </div>

    <div class="mb-3">
        <label for="confermaPsw" class="form-label">Conferma password</label>
        <div class="d-flex">
          <input type="password" class="form-control" id="confermaPsw" placeholder="Conferma la password" style="border-top-right-radius: 0; border-bottom-right-radius: 0;"/>
          <button class="btn btn-outline-secondary" type="button" name="togglePassword" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            <i class="bi bi-eye"></i></button>
        </div>
      </div>

      <button type="button" class="btn btn-primary w-100" id="btnChangePsw">
        <i class="bi bi-envelope-arrow-up me-2"></i> Cambia password
      </button>
    </form>

    <div id="loginError" class="alert alert-danger d-none" role="alert">
    Le password non coincidono
    </div>

    <div id="loginErrorPswAttuale" class="alert alert-danger d-none" role="alert">
    Password attuale non corretta
    </div>
  </div>
</body>
</html>
