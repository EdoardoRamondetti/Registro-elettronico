<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nuova Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      color: #333;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .password {
      font-size: 20px;
      font-weight: bold;
      color: #2b9348;
      background-color: #e9fbe9;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ciao!</h2>
    <p>Hai richiesto una nuova password per il tuo account. Eccola qui:</p>
    <div class="password">__password</div>
    <div>Al primo accesso dovrai cambiare la password</div>
  </div>
</body>
</html>
