<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password dimenticata - Registro Elettronico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./login.css" />
  <script src="./librerie/axios@1.1.2.min.js"></script>
    <script src="./libreria.js"></script>
  <script src="./passwordDimenticata.js"></script>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center">Password dimenticata</h2>
    <form>
        <div class="mb-3">
        <label for="user" class="form-label">Username</label>
        <input type="text" class="form-control" id="user" placeholder="Inserisci il tuo username"/>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Inserisci la tua email"/>
      </div>

    <div class="d-flex justify-content-center d-none" id="loadingSpinner">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

      <button type="button" class="btn btn-primary w-100" id="btnRecover">
        <i class="bi bi-envelope-arrow-up me-2"></i> Invia nuova password
      </button>

      <div class="text-center mt-3">
        <a href="login.html" class="text-decoration-none" style="color: #6a11cb;">Torna al login</a>
      </div>
    </form>
  </div>
</body>
</html>
